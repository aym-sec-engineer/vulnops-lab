name: VulnOps Security CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-policy:
    name: Quality, Tests and Security Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check src/ tests/

      - name: Ruff formatting
        run: python -m ruff format --check src/ tests/

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Generate baseline security report
        run: python -m src.report

      - name: Simulate remediation
        run: |
          python -m src.simulate_remediation
          python -m src.report \
            --inventory data/inventory-remediated.json \
            --output-dir reports/after

      - name: Verify policy rejects vulnerable inventory
        shell: bash
        run: |
          set +e
          python -m src.policy \
            --inventory data/inventory.json \
            --threshold 70
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "::error::Expected policy exit code 1; received $status"
            exit 1
          fi

          echo "Expected policy rejection confirmed"

      - name: Verify policy accepts simulated inventory
        run: |
          python -m src.policy \
            --inventory data/inventory-remediated.json \
            --threshold 70

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnops-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  secret-scanning:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}